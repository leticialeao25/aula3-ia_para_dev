<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Uma interface simples e acolhedora para conversar com a Kodie."
    />
    <title>Kodie — seu espaço de conversa</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="chat" aria-label="Chat com Kodie">
      <header class="chat__header">
        <div class="brand"
          <div class="brand__mark" aria-hidden="true">k</div>
          <div class="brand__copy">
            <h1>Kodie</h1>
            <p><span class="status-dot" aria-hidden="true"></span> pronta para conversar</p>
          </div>
        </div>
        <button class="button button--secondary clear-button" id="clear-chat" type="button">
          Limpar conversa
        </button>
      </header>

      <section
        class="messages"
        id="messages"
        aria-label="Mensagens da conversa"
        aria-live="polite"
        aria-relevant="additions text"
      >
        <div class="welcome" id="welcome">
          <span class="welcome__eyebrow">UM ESPAÇO SÓ SEU</span>
          <h2>Oi! Como posso ajudar?</h2>
          <p>Escreva sua mensagem e vamos começar uma conversa.</p>
          <div class="welcome__decoration" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="message-list" id="message-list"></div>
      </section>

      <div class="chat__footer">
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <form class="composer" id="message-form">
          <label class="sr-only" for="message-input">Digite sua mensagem</label>
          <textarea
            id="message-input"
            name="message"
            rows="1"
            placeholder="Escreva sua mensagem..."
            aria-label="Digite sua mensagem"
          ></textarea>
          <button class="button button--send" type="submit" aria-label="Enviar mensagem">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3.3 9.1 16.7 3.8l-5.3 13.4-2.1-5.8-6-2.3Z" />
              <path d="m9.3 11.4 4.1-4.1" />
            </svg>
          </button>
        </form>
        <p class="composer-hint">Enter para enviar <span aria-hidden="true">·</span> Shift + Enter para pular linha</p>
      </div>
    </main>
  </body>
</html>
